<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061F49" />
    <meta name="robots" content="noindex,nofollow" />
    <title>You're offline | Bastly Academy</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #10213A;
        background: #F4FAFF;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 80% 15%, rgba(35,127,209,.14), transparent 30%),
          #F4FAFF;
      }
      main {
        width: min(520px, 100%);
        padding: 32px;
        text-align: center;
        border: 1px solid #DFE8F1;
        border-radius: 28px;
        background: white;
        box-shadow: 0 24px 70px rgba(6,31,73,.12);
      }
      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 12px;
        color: #061F49;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: -.05em;
      }
      p {
        margin: 0 auto 24px;
        max-width: 390px;
        color: #64748B;
        line-height: 1.7;
      }
      button {
        min-height: 46px;
        border: 0;
        border-radius: 999px;
        padding: 0 20px;
        color: white;
        background: #237FD1;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/bastly-logo.webp" alt="Bastly Academy" />
      <h1>You're offline.</h1>
      <p>
        Bastly needs an internet connection for course access, videos, assessments,
        attendance, progress, and account data.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
